<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Nicolás Moncada — terminal profile</title>
  <desc id="dsc">Minimal terminal window with the public profile of Nicolás Moncada Montaño: systems engineering student, backend development and IoT prototyping.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#0E1520"/>
      <stop offset="0.55" stop-color="#0B111A"/>
      <stop offset="1" stop-color="#090D14"/>
    </linearGradient>
    <linearGradient id="nmGrad" gradientUnits="userSpaceOnUse" x1="88" y1="180" x2="372" y2="330">
      <stop offset="0" stop-color="#00F7FF"/>
      <stop offset="0.48" stop-color="#70A5FD"/>
      <stop offset="1" stop-color="#FF007F"/>
    </linearGradient>
    <linearGradient id="scanGrad" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00F7FF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#70A5FD" stop-opacity="0.8"/>
      <stop offset="0.8" stop-color="#FF007F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF007F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hairline" gradientUnits="userSpaceOnUse" x1="88" y1="0" x2="1112" y2="0">
      <stop offset="0" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00F7FF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#70A5FD" stop-opacity="0.35"/>
      <stop offset="0.75" stop-color="#FF007F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF007F" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="haloCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00F7FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00F7FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF007F" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF007F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0v36" fill="none" stroke="#1B2636" stroke-width="1"/>
    </pattern>
    <pattern id="crt" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.022"/>
    </pattern>
    <clipPath id="winClip">
      <rect x="40" y="30" width="1120" height="500" rx="16"/>
    </clipPath>

    <style>
      text {
        font-family: "Fira Code", "JetBrains Mono", "Cascadia Mono", "SFMono-Regular", Consolas, "Courier New", monospace;
      }
      .type { animation: type 1s steps(28, end) both; }
      .fade { animation: fade 0.9s ease-out both; }
      .blink { animation: blink 1.1s steps(1, end) infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .scan { animation: scan 9s linear infinite; }
      .power { animation: power 1.2s ease-out both; }
      .sheen { animation: sheen 6s ease-in-out infinite; }
      @keyframes type {
        0% { clip-path: inset(0 100% 0 0); }
        100% { clip-path: inset(0 0 0 0); }
      }
      @keyframes fade {
        0% { opacity: 0; transform: translateY(5px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      @keyframes scan {
        0% { transform: translateY(0); opacity: 0; }
        8% { opacity: 0.9; }
        88% { opacity: 0.9; }
        100% { transform: translateY(400px); opacity: 0; }
      }
      @keyframes power {
        0% { opacity: 0.35; }
        35% { opacity: 0.75; }
        42% { opacity: 0.4; }
        60% { opacity: 1; }
        100% { opacity: 1; }
      }
      @keyframes sheen {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.85; }
      }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="560" fill="#0D1117"/>
  <rect width="1200" height="560" fill="url(#grid)" opacity="0.35"/>
  <ellipse cx="150" cy="50" rx="420" ry="240" fill="url(#haloCyan)"/>
  <ellipse cx="1070" cy="530" rx="400" ry="220" fill="url(#haloPink)"/>

  <!-- window -->
  <g class="power">
    <rect x="40" y="30" width="1120" height="500" rx="16" fill="url(#panel)" stroke="#22304A" stroke-width="1.5"/>
    <rect x="40" y="30" width="1120" height="500" rx="16" fill="url(#crt)" clip-path="url(#winClip)"/>

    <!-- title bar -->
    <path d="M40 46a16 16 0 0 1 16-16h1088a16 16 0 0 1 16 16v34H40z" fill="#111826"/>
    <line x1="40" y1="80.5" x2="1160" y2="80.5" stroke="#1E2B3D"/>
    <circle cx="68" cy="55" r="6.5" fill="#FF5F57"/>
    <circle cx="92" cy="55" r="6.5" fill="#FEBC2E"/>
    <circle cx="116" cy="55" r="6.5" fill="#28C840"/>
    <text x="600" y="59.5" text-anchor="middle" font-size="12.5" fill="#8B98AB">nicolas@dev: ~ — shell</text>

    <rect x="1016" y="42" width="128" height="26" rx="13" fill="#0B2428" stroke="#00F7FF" stroke-opacity="0.35"/>
    <circle cx="1034" cy="55" r="3.6" fill="#00F7FF" class="pulse"/>
    <text x="1046" y="59" font-size="9.5" letter-spacing="1.2" fill="#00F7FF">LIVE · 24/7</text>

    <!-- corner accents -->
    <path d="M64 116V98h20" fill="none" stroke="#00F7FF" stroke-width="1.5" opacity="0.45"/>
    <path d="M1136 466v18h-20" fill="none" stroke="#FF007F" stroke-width="1.5" opacity="0.45"/>

    <!-- prompt -->
    <g class="type" style="animation-delay:.12s;animation-duration:.85s">
      <text x="88" y="112" font-size="13">
        <tspan fill="#FF007F">┌──(</tspan><tspan fill="#00F7FF">nicolas@dev</tspan><tspan fill="#FF007F">)-[</tspan><tspan fill="#70A5FD">~</tspan><tspan fill="#FF007F">]</tspan>
      </text>
      <text x="88" y="137" font-size="13">
        <tspan fill="#FF007F">└─$</tspan><tspan fill="#C9D1D9"> whoami --verbose</tspan>
      </text>
    </g>
    <g class="fade" style="animation-delay:1.05s">
      <rect x="310" y="125" width="8" height="15" fill="#00F7FF" class="blink"/>
    </g>

    <!-- ascii identity -->
    <g fill="url(#nmGrad)" xml:space="preserve" style="filter: drop-shadow(0 0 6px rgba(0,247,255,.35))">
      <text x="88" y="190" font-size="19">███╗   ██╗███╗   ███╗</text>
      <text x="88" y="215" font-size="19">████╗  ██║████╗ ████║</text>
      <text x="88" y="240" font-size="19">██╔██╗ ██║██╔████╔██║</text>
      <text x="88" y="265" font-size="19">██║╚██╗██║██║╚██╔╝██║</text>
      <text x="88" y="290" font-size="19">██║ ╚████║██║ ╚═╝ ██║</text>
      <text x="88" y="315" font-size="19">╚═╝  ╚═══╝╚═╝     ╚═╝</text>
    </g>

    <g class="fade" style="animation-delay:.95s">
      <text x="226" y="348" text-anchor="middle" font-size="12" letter-spacing="2.1" fill="#E6EDF3" font-weight="600">NICOLÁS MONCADA MONTAÑO</text>
      <text x="226" y="366" text-anchor="middle" font-size="9.5" letter-spacing="2" fill="#70A5FD">SYSTEMS ENGINEERING · UNIMINUTO</text>
      <text x="226" y="383" text-anchor="middle" font-size="9.5" letter-spacing="1.6" fill="#6E7B8F">BOGOTÁ · COLOMBIA · UTC-5</text>
    </g>

    <!-- public profile report -->
    <g font-size="13" fill="#C9D1D9">
      <g class="type" style="animation-delay:1.35s;animation-duration:.5s">
        <text x="420" y="190" font-size="9.8" letter-spacing="1.4" fill="#70A5FD">OS</text>
        <text x="528" y="190">Linux · Windows</text>
      </g>
      <g class="type" style="animation-delay:1.57s;animation-duration:.6s">
        <text x="420" y="216" font-size="9.8" letter-spacing="1.4" fill="#70A5FD">STACK</text>
        <text x="528" y="216">Python · FastAPI · PHP · JavaScript · SQL · C++</text>
      </g>
      <g class="type" style="animation-delay:1.79s;animation-duration:.5s">
        <text x="420" y="242" font-size="9.8" letter-spacing="1.4" fill="#70A5FD">DATA</text>
        <text x="528" y="242">PostgreSQL · Supabase · MySQL</text>
      </g>
      <g class="type" style="animation-delay:2.01s;animation-duration:.5s">
        <text x="420" y="268" font-size="9.8" letter-spacing="1.4" fill="#70A5FD">HARDWARE</text>
        <text x="528" y="268">Arduino · sensors · motor control</text>
      </g>
      <g class="type" style="animation-delay:2.23s;animation-duration:.45s">
        <text x="420" y="294" font-size="9.8" letter-spacing="1.4" fill="#70A5FD">WEARABLE</text>
        <text x="528" y="294">Zepp OS mini-apps (JavaScript)</text>
      </g>
      <g class="type" style="animation-delay:2.45s;animation-duration:.5s">
        <text x="420" y="320" font-size="9.8" letter-spacing="1.4" fill="#70A5FD">GITHUB</text>
        <text x="528" y="320">github.com/nicolasmoncada160622-prog</text>
      </g>
      <g class="type" style="animation-delay:2.67s;animation-duration:.5s">
        <text x="420" y="346" font-size="9.8" letter-spacing="1.4" fill="#70A5FD">UPTIME</text>
        <text x="528" y="346"><tspan fill="#00F7FF">24/7</tspan> — profile automation <tspan fill="#28C840">online</tspan></text>
      </g>
      <g class="type" style="animation-delay:2.89s;animation-duration:.45s">
        <text x="420" y="372" font-size="9.8" letter-spacing="1.4" fill="#70A5FD">LOCALE</text>
        <text x="528" y="372">Bogotá, Colombia (UTC-5)</text>
      </g>
    </g>

    <line x1="88" y1="408" x2="1112" y2="408" stroke="url(#hairline)" stroke-width="1"/>

    <!-- closing prompt -->
    <g class="type" style="animation-delay:3.2s;animation-duration:.8s">
      <text x="88" y="446" font-size="12.5" textLength="392" lengthAdjust="spacingAndGlyphs">
        <tspan fill="#00F7FF">nicolas@dev</tspan><tspan fill="#FF007F">:~$</tspan><tspan fill="#C9D1D9"> echo "keep learning · keep building"</tspan>
      </text>
    </g>
    <g class="fade" style="animation-delay:4.05s">
      <rect x="486" y="434" width="8" height="14" fill="#00F7FF" class="blink"/>
    </g>

    <!-- status bar -->
    <path d="M40 492h1120v22a16 16 0 0 1-16 16H56a16 16 0 0 1-16-16z" fill="#0A0E14"/>
    <line x1="40" y1="492" x2="1160" y2="492" stroke="#1E2B3D"/>
    <g class="fade" style="animation-delay:3.7s">
      <circle cx="66" cy="512" r="3.4" fill="#00F7FF" class="pulse"/>
      <text x="78" y="516" font-size="9" letter-spacing="1.5" fill="#00F7FF">HEARTBEAT ACTIVE</text>
      <text x="212" y="516" font-size="9" letter-spacing="1" fill="#5E6C80">· America/Bogota · UTC-5</text>
      <text x="600" y="516" font-size="9" letter-spacing="1" fill="#70A5FD" text-anchor="middle">github.com/nicolasmoncada160622-prog</text>
      <text x="1132" y="516" font-size="9" letter-spacing="1.4" fill="#FF007F" text-anchor="end">PROFILE ENGINE v2.1</text>
    </g>

    <!-- animated scanline -->
    <g clip-path="url(#winClip)">
      <rect x="40" y="82" width="1120" height="2" fill="url(#scanGrad)" class="scan" opacity="0.6"/>
    </g>
  </g>

  <rect x="40" y="30" width="1120" height="500" rx="16" fill="none" stroke="url(#hairline)" stroke-width="1.2" class="sheen"/>
</svg>
