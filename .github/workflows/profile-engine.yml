name: Profile Engine 24/7

# ─────────────────────────────────────────────────────────────────────────────
#  PROFILE ENGINE v2.0 · 16-bit Arcade Edition
#  Orquesta todos los generadores SVG (dark & light), valida XML/accesibilidad
#  y actualiza README.md, .heartbeat y assets/ automáticamente.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-engine-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: America/Bogota

jobs:
  engine:
    name: 🎮 Build & Sync Profile Engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify repository owner consistency
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          cfg = json.loads(pathlib.Path("profile.config.json").read_text(encoding="utf-8"))
          owner = os.environ["REPO_OWNER"]
          expected = cfg.get("github_username")
          print(f"Repo owner: {owner} | Config username: {expected}")
          if expected and owner.lower() != expected.lower():
              print(f"::warning::github.repository_owner ({owner}) difiere de profile.config.json ({expected})")
          PY

      - name: Build & validate all SVGs + README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/build_all.py

      - name: Commit & push (safe rebase retry)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md .heartbeat assets/

          if git diff --cached --quiet; then
            echo "No changes detected — nothing to commit."
            exit 0
          fi

          git commit -m "chore(engine): sync profile engine v2.0 [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Profile engine pushed on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected — pulling with rebase (attempt ${attempt})."
            git pull --rebase origin main || {
              git checkout --theirs README.md .heartbeat assets/ || true
              git add README.md .heartbeat assets/
              git -c core.editor=true rebase --continue || true
            }
          done

          echo "::error::Unable to push the profile engine after 3 attempts."
          exit 1
