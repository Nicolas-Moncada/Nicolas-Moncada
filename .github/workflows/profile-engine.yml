name: Profile Engine 24/7

# ─────────────────────────────────────────────────────────────────────────────
#  PROFILE ENGINE v4.0 · pixel / arcade edition
#
#  One sequential job, one source of truth:
#   1. Reads the real public contribution graph.
#   2. Generates the snake and publishes the raw copy to the output branch.
#   3. Regenerates the framed snake and the real contributions panel.
#   4. Injects the real heartbeat into README.md and .heartbeat.
#   5. Pushes everything to main with a safe retry.
#
#  Why one job? The old version had two jobs pushing to main at the same time.
#  This version removes that race. Generated data is deterministic; the only
#  variable is the timestamp, and that is exactly what keeps the engine alive.
#
#  Public data only. No private repositories, no hardware details, no
#  invented metrics.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-engine-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: America/Bogota

jobs:
  engine:
    name: 🎮 Sync real profile data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00F7FF&color_dots=#101A2B,#1E6E7A,#00A8B8,#FFD166,#FF9E4A
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish raw snake to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: "chore(snake): real contribution grid [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build real contributions panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/build_contributions.py

      - name: Frame the snake with the profile palette
        run: python3 scripts/build_snake_frame.py dist/github-contribution-grid-snake-dark.svg

      - name: Inject real heartbeat into README + .heartbeat
        run: python3 scripts/update_heartbeat.py

      - name: Show generated stats
        run: |
          echo "── Real public data ─────────────────────────"
          cat assets/contributions.json

      - name: Commit & push (safe retry)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES="README.md .heartbeat assets/contributions.svg assets/contributions.json assets/contribution-snake.svg"
          git add $FILES

          if git diff --cached --quiet; then
            echo "No changes detected — nothing to do."
            exit 0
          fi

          git commit -m "chore(engine): sync real profile data [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Profile engine pushed on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected — rebasing on origin/main (attempt ${attempt})."
            git fetch origin main

            if ! git rebase origin/main; then
              # During a rebase, --theirs is our freshly generated commit.
              # Keep the generated files; never publish stale data.
              git checkout --theirs $FILES || true
              git add $FILES
              git -c core.editor=true rebase --continue || true
            fi
          done

          echo "::error::Unable to push the profile engine after 3 attempts."
          exit 1
